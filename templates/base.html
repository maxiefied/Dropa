<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dropa{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bs-primary: #1f6b4f;
      --bs-primary-rgb: 31, 107, 79;
      --bs-link-color: #1f6b4f;
      --bs-link-color-rgb: 31, 107, 79;
      --bs-link-hover-color: #144a36;
      --bs-link-hover-color-rgb: 20, 74, 54;
    }
    .btn-primary {
      --bs-btn-bg: #1f6b4f;
      --bs-btn-border-color: #1f6b4f;
      --bs-btn-hover-bg: #185840;
      --bs-btn-hover-border-color: #185840;
      --bs-btn-active-bg: #144a36;
      --bs-btn-active-border-color: #144a36;
      --bs-btn-disabled-bg: #1f6b4f;
      --bs-btn-disabled-border-color: #1f6b4f;
    }
    .page { max-width: 34rem; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container page">
      <a class="navbar-brand fw-bold" href="{% url 'accounts:dashboard' %}">Dropa</a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-secondary">Log out</button>
        </form>
      {% endif %}
    </div>
  </nav>

  <main class="container page py-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
